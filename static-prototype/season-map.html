<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World of Outlaws — 2026 Season Route</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0a0a0c;
    --asphalt-2:#131316;
    --chalk:#f2ede1;
    --chalk-dim:#a8a49a;
    --amber:#ffb400;
    --amber-dim:#8a5c00;
    --clay:#c1552f;
    --clay-dim:#5c2c17;
    --panel-border:rgba(255,180,0,0.18);

    /* WRG series brand colors — placeholders, swap for exact brand hex if available */
    --sprint-blue:#2F80ED;
    --sprint-blue-glow:#6FA8FF;
    --latemodel-yellow:#FFCB05;
    --latemodel-yellow-glow:#FFE066;
    --next-race-grey:#7A7A82;

    /* set at runtime by setActiveSeries() to the active series' brand colors */
    --active-brand:var(--sprint-blue);
    --active-brand-glow:var(--sprint-blue-glow);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--asphalt);font-family:'Inter',sans-serif;color:var(--chalk);overflow:hidden;}
  #map{position:absolute;inset:0;}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    /* right padding cleared past the MapLibre NavigationControl (29px zoom stack + 10px
       margin, top-right) so the Replay Route button doesn't sit under it */
    padding:18px 64px 18px 26px;
    background:linear-gradient(to bottom, rgba(10,10,12,0.92), rgba(10,10,12,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.22em;
    color:var(--amber);text-transform:uppercase;
  }
  .brand h1{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.01em;
    margin:0;text-transform:uppercase;color:var(--chalk);
  }
  .replay-btn{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--asphalt);background:var(--amber);
    border:none;border-radius:3px;padding:11px 20px;cursor:pointer;
    box-shadow:0 0 18px rgba(255,180,0,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .replay-btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(255,180,0,0.5);}
  .replay-btn:active{transform:translateY(0);}
  .replay-btn:disabled{opacity:0.5;cursor:default;transform:none;box-shadow:none;}

  .legend{
    position:absolute;bottom:22px;left:22px;z-index:5;
    background:rgba(19,19,22,0.88);border:1px solid var(--panel-border);
    border-radius:6px;padding:10px 12px;
    font-size:12px;color:var(--chalk-dim);
    display:flex;flex-direction:column;gap:10px;
    backdrop-filter:blur(6px);
  }
  .series-tabs{display:flex;gap:4px;background:rgba(0,0,0,0.35);padding:3px;border-radius:5px;}
  .series-tab{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--chalk-dim);background:transparent;border:none;
    border-radius:3px;padding:6px 11px;cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .series-tab.is-active{background:var(--active-brand);color:var(--asphalt);}
  .legend-items{display:flex;gap:16px;align-items:center;padding:0 2px;}
  .legend-item{display:flex;align-items:center;gap:7px;}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .swatch.brand{background:var(--active-brand);box-shadow:0 0 6px var(--active-brand);}
  .swatch.next{background:var(--next-race-grey);}

  .stop-counter{
    position:absolute;bottom:22px;right:22px;z-index:5;
    background:rgba(19,19,22,0.88);border:1px solid var(--panel-border);
    border-radius:6px;padding:12px 18px;text-align:right;
    backdrop-filter:blur(6px);
  }
  .stop-counter .num{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--amber);}
  .stop-counter .label{font-size:11px;letter-spacing:0.08em;color:var(--chalk-dim);text-transform:uppercase;}

  .maplibregl-popup{max-width:280px !important;}
  .maplibregl-popup-content{
    background:var(--asphalt-2) !important;
    border:1px solid var(--panel-border);
    border-radius:8px !important;
    padding:0 !important;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  .maplibregl-popup-tip{border-top-color:var(--asphalt-2) !important;border-bottom-color:var(--asphalt-2) !important;}
  .maplibregl-popup-close-button{
    color:var(--chalk-dim) !important;font-size:18px !important;padding:4px 8px !important;
  }
  .popup-image{width:100%;height:120px;object-fit:cover;display:block;background:#000;}
  .popup-body{padding:14px 16px 16px;}
  .popup-status{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:0.14em;
    text-transform:uppercase;margin-bottom:6px;
  }
  .popup-status.past{color:var(--clay);}
  .popup-status.future{color:var(--amber);}
  .popup-track{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;color:var(--chalk);margin:0 0 3px;}
  .popup-event{font-size:12.5px;color:var(--chalk-dim);margin:0 0 10px;line-height:1.4;}
  .popup-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--chalk-dim);border-top:1px solid rgba(255,255,255,0.08);padding-top:9px;}
  .popup-meta .purse{color:var(--amber);font-weight:600;}
</style>
</head>

<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">World Racing Group</span>
    <h1>2026 World of Outlaws Season</h1>
  </div>
  <button class="replay-btn" id="replayBtn">Replay Route</button>
</div>

<div class="legend">
  <div class="series-tabs" role="tablist" aria-label="Race series">
    <button class="series-tab" type="button" data-series="sprint" role="tab">Sprint Car</button>
    <button class="series-tab" type="button" data-series="latemodel" role="tab">Late Model</button>
  </div>
  <div class="legend-items">
    <div class="legend-item"><span class="swatch brand"></span>Races to date</div>
    <div class="legend-item"><span class="swatch next"></span>Next race</div>
  </div>
</div>

<div class="stop-counter">
  <div class="num" id="stopCount">0 / 106</div>
  <div class="label">Stops on route</div>
</div>

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function buildSeries(key, label, colors, featureCollection){
  const points = featureCollection.features.slice().sort((a, b) => a.properties.date.localeCompare(b.properties.date));
  const coords = points.map(f => f.geometry.coordinates);
  const total = points.length;
  const today = todayISO();

  // "current race" = most recent stop whose date has passed; stops are chronological,
  // so the first date >= today ends the raced streak.
  let currentIndex = -1;
  for (let i = 0; i < points.length; i++) {
    if (points[i].properties.date < today) currentIndex = i;
    else break;
  }
  const nextIndex = currentIndex + 1 < total ? currentIndex + 1 : -1;

  return {
    key, label, colors, points, coords, total, currentIndex, nextIndex,
    featureCollection: { type: 'FeatureCollection', features: points }
  };
}

const SERIES = {
  sprint: buildSeries('sprint', 'Sprint Car', {
    base: '#2F80ED', glow: '#6FA8FF', core: '#dce9ff'
  }, SPRINT_POINTS),
  latemodel: buildSeries('latemodel', 'Late Model', {
    base: '#FFCB05', glow: '#FFE066', core: '#fff8d6'
  }, LATEMODEL_POINTS)
};

function nextRaceDate(s){
  return s.nextIndex >= 0 ? s.points[s.nextIndex].properties.date : null;
}

// default tab: whichever series' next race is soonest; Sprint Car wins ties/no-data
let activeKey = 'sprint';
{
  const sprintNext = nextRaceDate(SERIES.sprint);
  const lateNext = nextRaceDate(SERIES.latemodel);
  if (lateNext && (!sprintNext || lateNext < sprintNext)) activeKey = 'latemodel';
}

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/dark',
  center: [-93.5, 39.5],
  zoom: 3.9,
  attributionControl: { compact: true }
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

function fmtDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone:'UTC' });
}
function fmtPurse(p){
  if(!p) return null;
  const n = parseFloat(p);
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
}

function emptyLine(){
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] }, properties: {} };
}
function setRouteData(coords){
  map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} });
}
function setNextRouteData(coords){
  map.getSource('route-next').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} });
}

  map.addSource('route', { type: 'geojson', data: emptyLine() });

  // glow: wide, blurred, low-opacity line underneath — recolored per active series
  map.addLayer({
    id: 'route-glow-outer',
    type: 'line',
    source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': SERIES[activeKey].colors.base, 'line-width': 14, 'line-blur': 10, 'line-opacity': 0.35 }
  });
  map.addLayer({
    id: 'route-glow-inner',
    type: 'line',
    source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': SERIES[activeKey].colors.glow, 'line-width': 6, 'line-blur': 4, 'line-opacity': 0.55 }
  });
  // bright core line on top
  map.addLayer({
    id: 'route-core',
    type: 'line',
    source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': SERIES[activeKey].colors.core, 'line-width': 2.2, 'line-opacity': 0.95 }
  });

  // next-race preview: single grey segment, no glow — a preview, not history
  map.addSource('route-next', { type: 'geojson', data: emptyLine() });
  map.addLayer({
    id: 'route-next-preview',
    type: 'line',
    source: 'route-next',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#7A7A82', 'line-width': 2, 'line-opacity': 0.75, 'line-dasharray': [2, 2] }
  });

  // all points in the active series, uniform brand color (status no longer affects pin color)
  map.addSource('stops', { type: 'geojson', data: SERIES[activeKey].featureCollection });

  map.addLayer({
    id: 'stops-glow',
    type: 'circle',
    source: 'stops',
    paint: {
      'circle-radius': 9,
      'circle-color': SERIES[activeKey].colors.base,
      'circle-opacity': 0.35,
      'circle-blur': 1
    }
  });

  map.addLayer({
    id: 'stops-dot',
    type: 'circle',
    source: 'stops',
    paint: {
      'circle-radius': 5,
      'circle-color': SERIES[activeKey].colors.base,
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#0a0a0c'
    }
  });

  map.on('mouseenter', 'stops-dot', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'stops-dot', () => map.getCanvas().style.cursor = '');

  map.on('click', 'stops-dot', (e) => {
    const p = e.features[0].properties;
    const isPast = p.date < todayISO();
    const imgHtml = p.image
      ? `<img class="popup-image" src="${p.image}" alt="${p.track} aerial" onerror="this.style.display='none'">`
      : '';
    const purse = fmtPurse(p.purse);
    const html = `
      ${imgHtml}
      <div class="popup-body">
        <div class="popup-status ${isPast ? 'past' : 'future'}">${isPast ? 'Raced' : 'Upcoming'} · ${fmtDate(p.date)}</div>
        <p class="popup-track">${p.track}</p>
        <p class="popup-event">${p.event}</p>
        <div class="popup-meta">
          <span>${p.city}, ${p.state}</span>
          ${purse ? `<span class="purse">${purse} to win</span>` : ''}
        </div>
      </div>`;
    new maplibregl.Popup({ closeButton: true, offset: 12 })
      .setLngLat(e.features[0].geometry.coordinates)
      .setHTML(html)
      .addTo(map);
  });

  document.querySelectorAll('.series-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.series;
      if (key === activeKey) return;
      setActiveSeries(key);
    });
  });

  updateTabsUI();
  runRouteAnimation();
});

function updateTabsUI(){
  document.querySelectorAll('.series-tab').forEach((btn) => {
    btn.classList.toggle('is-active', btn.dataset.series === activeKey);
  });
}

function setActiveSeries(key){
  activeKey = key;
  const s = SERIES[key];

  document.documentElement.style.setProperty('--active-brand', s.colors.base);
  document.documentElement.style.setProperty('--active-brand-glow', s.colors.glow);

  map.getSource('stops').setData(s.featureCollection);
  map.setPaintProperty('stops-dot', 'circle-color', s.colors.base);
  map.setPaintProperty('stops-glow', 'circle-color', s.colors.base);
  map.setPaintProperty('route-glow-outer', 'line-color', s.colors.base);
  map.setPaintProperty('route-glow-inner', 'line-color', s.colors.glow);
  map.setPaintProperty('route-core', 'line-color', s.colors.core);

  updateTabsUI();
  runRouteAnimation();
}

// per-stop pacing (not a fixed total) so pace stays consistent regardless of how many
// stops have actually happened yet by the time this page is viewed
const STOP_MS = 350;

let animToken = 0;

function runRouteAnimation(){
  const token = ++animToken;
  const s = SERIES[activeKey];
  const replayBtn = document.getElementById('replayBtn');
  const stopCountEl = document.getElementById('stopCount');
  replayBtn.disabled = true;

  setRouteData([]);
  setNextRouteData([]);

  const racedCoords = s.coords.slice(0, s.currentIndex + 1);

  function finishAll(){
    stopCountEl.textContent = `${Math.max(s.currentIndex + 1, 0)} / ${s.total}`;
    replayBtn.disabled = false;
  }

  function animateNextSegment(){
    if (s.currentIndex < 0 || s.nextIndex < 0) { finishAll(); return; }
    const a = s.coords[s.currentIndex];
    const b = s.coords[s.nextIndex];
    const start = performance.now();
    function frame(now){
      if (token !== animToken) return;
      const t = Math.min(1, (now - start) / STOP_MS);
      setNextRouteData([a, [ a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t ]]);
      if (t < 1) requestAnimationFrame(frame);
      else finishAll();
    }
    requestAnimationFrame(frame);
  }

  if (s.currentIndex <= 0) {
    // 0 or 1 raced stop: nothing to draw a line through yet
    setRouteData(racedCoords);
    stopCountEl.textContent = `${Math.max(s.currentIndex + 1, 0)} / ${s.total}`;
    animateNextSegment();
    return;
  }

  const segments = s.currentIndex; // (currentIndex + 1) raced points => currentIndex segments
  const duration = segments * STOP_MS;
  const start = performance.now();

  function frame(now){
    if (token !== animToken) return; // superseded by a tab switch / replay
    const t = Math.min(1, (now - start) / duration);
    const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; // ease-in-out

    const exactIndex = eased * segments;
    const wholeIndex = Math.floor(exactIndex);
    const frac = exactIndex - wholeIndex;

    let coords = s.coords.slice(0, wholeIndex + 1);
    if (wholeIndex < segments) {
      const a = s.coords[wholeIndex];
      const b = s.coords[wholeIndex + 1];
      coords = coords.concat([[ a[0] + (b[0]-a[0])*frac, a[1] + (b[1]-a[1])*frac ]]);
    }

    setRouteData(coords);
    stopCountEl.textContent = `${wholeIndex + 1} / ${s.total}`;

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      setRouteData(racedCoords);
      stopCountEl.textContent = `${s.currentIndex + 1} / ${s.total}`;
      animateNextSegment();
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById('replayBtn').addEventListener('click', runRouteAnimation);
</script>

</body>
</html>
